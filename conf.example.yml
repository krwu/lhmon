# 单渠道（兼容旧配置）：设置 notify_method 后只发该渠道
notify_method: sct # sct|werobot|notifyx|telegram|smtp|sendgrid|mailgun
sct_key: SERVER_SEND_KEY # Server酱 SendKey
# werobot_webhook: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=KEY
# werobot_chatid: CHATID # 可选；腾讯内部场景可用
# notifyx_key: YOUR_NOTIFYX_KEY
# notifyx_team: YOUR_TEAM
# telegram_bot_token: YOUR_BOT_TOKEN
# telegram_user_id: YOUR_USER_ID

# 多渠道：去掉（或留空）notify_method，为需要的渠道设置 enabled: true 并补全参数。
# 扁平字段（如 sct_key）仍可作为对应渠道的回退值。
# sct:
#   enabled: true
#   key: SERVER_SEND_KEY
# werobot:
#   enabled: true
#   webhook: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=KEY
#   chatid: ""
# notifyx:
#   enabled: true
#   key: YOUR_NOTIFYX_KEY
#   team: YOUR_TEAM
# telegram:
#   enabled: true
#   bot_token: YOUR_BOT_TOKEN
#   user_id: YOUR_USER_ID
# smtp:
#   enabled: true
#   host: smtp.example.com
#   port: 587
#   username: user
#   password: pass
#   from: alert@example.com
#   to: [you@example.com]
# sendgrid:
#   enabled: true
#   api_key: SG.xxx
#   from: alert@example.com
#   to: you@example.com
# mailgun:
#   enabled: true
#   domain: mg.example.com
#   api_key: key-xxx
#   from: alert@example.com
#   to: [you@example.com]
#   # base_url: https://api.eu.mailgun.net  # 可选，欧盟区

check_interval: 30 # 流量检查间隔，单位：秒
accounts: # 要检查的账户列表
  - name: "账户一" # 账户名称
    secret_id: "secret_id_1" # 该帐户的 secretId
    secret_key: "secret_key_1" # 该账户的 secretKey
    regions: [ "ap-hongkong", "ap-guangzhou" ] # 轻量监控区域（SSL 不依赖 region）
  - name: "账户二" # 账户名称
    secret_id: "secret_id_2" # 该帐户的 secretId
    secret_key: "secret_key_2" # 该账户的 secretKey
    regions: [ "ap-guangzhou" ] # 要监控的区域

# SSL 证书清理（账号级，与 regions 无关）
ssl:
  enabled: false          # 总开关，显式打开后才巡检 SSL
  auto_delete: true       # 无关联资源时自动删除（默认 true）
  dry_run: true           # true=走完全流程但不真实删除（默认 true，联调安全）
  # expire_days: 30       # 可选；设置后按 CertEndTime 剩余天数判定即将过期。省略则用官方 FilterExpiring（约 30 天）
  check_interval: 86400   # SSL 巡检间隔（秒），默认每天一次，与流量间隔解耦
  # bind_task_timeout: 120
  # bind_use_cache: true
